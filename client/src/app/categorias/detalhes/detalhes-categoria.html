@if (mensagemErro()) {
  <div [class]="ui.alertaErro + ' mb-6'" role="alert">{{ mensagemErro() }}</div>
}

@if (carregando()) {
  <p [class]="ui.painel + ' text-muted-foreground'" role="status">Carregando categoria...</p>
} @else if (categoria(); as categoria) {
  <a
    routerLink="/categorias/listar"
    class="mb-4 inline-flex items-center gap-1.5 rounded text-sm font-semibold text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
  >
    <svg lucideArrowLeft class="size-4" aria-hidden="true"></svg> Categorias
  </a>

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex min-w-0 items-center gap-4">
      <span
        [class]="
          'grid size-14 shrink-0 place-items-center rounded-2xl text-2xl font-bold ' +
          corCategoria(categoria)
        "
        aria-hidden="true"
        >{{ categoria.titulo.trim().charAt(0).toUpperCase() }}</span
      >
      <h1 class="min-w-0 text-2xl font-bold tracking-tight break-words text-foreground">
        {{ categoria.titulo }}
      </h1>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" [class]="ui.botaoPerigo" (click)="abrirConfirmacao()">
        <svg lucideTrash class="size-4" aria-hidden="true"></svg> Excluir
      </button>
      <a [routerLink]="['/categorias/editar', categoria.id]" [class]="ui.botaoContorno">
        <svg lucidePencil class="size-4" aria-hidden="true"></svg> Editar
      </a>
    </div>
  </div>

  <app-confirm-dialog
    [aberto]="confirmandoExclusao()"
    titulo="Excluir categoria?"
    texto="Esta categoria será removida."
    rotuloConfirmar="Excluir categoria"
    [pendente]="excluindo()"
    (confirmar)="confirmarExclusao()"
    (cancelar)="cancelarExclusao()"
  />
}
