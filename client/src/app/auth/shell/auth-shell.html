<div class="grid min-h-screen bg-background lg:grid-cols-2">
  <aside
    class="relative hidden overflow-hidden bg-brand p-12 text-primary-foreground lg:flex lg:flex-col"
  >
    <div
      class="absolute -top-24 -right-24 size-80 rounded-full bg-primary-foreground/10"
      aria-hidden="true"
    ></div>
    <div
      class="absolute -bottom-32 -left-20 size-96 rounded-full bg-primary-foreground/10"
      aria-hidden="true"
    ></div>
    <a
      routerLink="/"
      class="relative flex items-center gap-2.5 self-start rounded-xl text-lg font-bold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-foreground focus-visible:ring-offset-2 focus-visible:ring-offset-primary"
    >
      <span
        class="grid size-9 place-items-center rounded-xl bg-primary-foreground/20"
        aria-hidden="true"
      >
        <svg lucideNotebookPen class="size-4.5"></svg>
      </span>
      NoteKeeper
    </a>
    <div class="relative my-auto py-10">
      <app-notes-collage class="h-80" [naMarca]="true" />
      <p class="mt-12 max-w-md text-4xl leading-tight font-extrabold tracking-tight">
        Cada ideia no seu lugar.
      </p>
      <p class="mt-3 max-w-sm text-primary-foreground/80">
        Escreva notas, separe por categorias coloridas e encontre tudo quando precisar.
      </p>
    </div>
  </aside>

  <main class="flex flex-col px-6 py-10 sm:px-12">
    <a
      routerLink="/"
      class="flex items-center gap-2.5 self-start rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 lg:hidden"
    >
      <span
        class="grid size-9 place-items-center rounded-xl bg-brand text-primary-foreground shadow-float"
        aria-hidden="true"
      >
        <svg lucideNotebookPen class="size-4.5"></svg>
      </span>
      <span class="text-lg font-bold tracking-tight text-foreground">NoteKeeper</span>
    </a>
    <div class="mx-auto my-auto w-full max-w-md py-10">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
